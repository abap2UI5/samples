name: check-keywords

# Every sample here has to say what it is about, in two `"` comment lines the
# ABAP compiler cannot see and therefore cannot enforce. Nothing about a sample
# without them is broken - it compiles, it runs, it is listed in the overview -
# which is exactly why the omission survives: the only symptom is that nobody
# looking for it ever arrives, in the overview's search box, in Ctrl+F over
# SAMPLES.md and in abap2UI5/mcp-server's `examples` tool alike.
#
# 104 classes carry the lines and nothing checked them. The generator refuses a
# TILE without them, but it rewrites the tree while it does so, which is why it
# cannot be a pull request check - and it never sees src/00/97, whose six
# samples the cookbook links to.
#
# Plain node, no dependencies, so it stays a few seconds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-keywords-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node scripts/check-keywords.mjs
