name: check-selftest

# The source-scanning gates tested against fixtures: check-atc.mjs,
# check-app-patterns.mjs and check-api-keywords.mjs. After the sweep that
# motivates a rule the tree no longer holds the shape it was written for, so a
# rule that silently stopped matching looks exactly like a clean tree - green
# on every pull request while it decides nothing. scripts/test/ runs each rule
# against a fixture that must fire it and one that must not.
#
# Plain node (`node --test`), no dependencies, so it stays a few seconds.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - run: npm run check:selftest
