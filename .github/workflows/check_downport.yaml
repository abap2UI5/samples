name: check_downport

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check_downport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto_downport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - run: npm ci
    - run: rm -rf src/00
    - run: npm run downport
