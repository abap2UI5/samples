name: abap-702

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: abap-702-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abap-702:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run downport
    - run: npx abaplint .github/abaplint/abap_702.jsonc
