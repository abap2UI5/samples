name: check-abap2UI5

# The abap2UI5-specific lint, as opposed to abap-standard/cloud/702, which
# lint ABAP itself. It checks a whole app class against five rule groups:
# the controls and members it writes, the structure of the document, the
# UI5 version and deprecation floor, the data and usability of the result,
# and the abap2ui5 semantics - the defects that live in the relationship
# between the ABAP class and the view it builds, which no UI5 tooling sees.
# Configuration lives in abap2ui5lint.jsonc; the linter is a devDependency
# resolved through package-lock.json, so CI and `npm run check:abap2ui5` run
# the same version.
#
# @abap2ui5/render-runtime is the SECOND devDependency, and the render gate
# below is the only reason for it: it carries the @openui5 source packages and
# playwright the gate serves. The linter names it as an OPTIONAL PEER, which
# is the one dependency kind npm does not install on its own - so it has to be
# declared here, or `npx abap2ui5lint` reports the runtime missing and the 172
# documents stop being rendered. It used to arrive by itself, as an optional
# DEPENDENCY of the linter, which npm does install by default; splitting it
# out is what keeps a plain `npx @abap2ui5/linter` a small download.
#
# The run reports what it LOOKED at, not only what it found: the gates log
# every file into a collapsed group while they run, and the job closes with
# the run summary (how many classes, views, controls, bindings and icons were
# judged, what the baseline swallowed, how long each gate took). On a corpus
# whose findings are all baselined that summary is the only thing standing
# between "148 classes were checked" and "nothing was checkable" - a
# distinction this repository has been on the wrong side of before
# (AGENTS.md 6). It also goes into the job summary of the run, and into the
# two README badges below.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: check-abap2UI5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-abap2UI5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # check out the branch, not the merge commit, so the badge can go back
        ref: ${{ github.event.pull_request.head.ref || github.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    # the render gate drives a headless browser
    - run: npx playwright install chromium --with-deps
    - run: npx abap2ui5lint

    # The same corpus once more as markdown, into the job summary - findings
    # and run summary on the run's own page, without expanding a log. A second
    # pass, costing the property gate only (--no-render: whether the views
    # load was decided by the step above), and --no-badge because a pass that
    # skipped a gate must not overwrite the badge the real run wrote.
    - name: Job summary
      if: always()
      run: npx abap2ui5lint --no-render --advisory --no-progress --no-badge --format markdown >> "$GITHUB_STEP_SUMMARY"

    # abap2ui5lint.jsonc points "badge" at .github/badges/abap2ui5.json (what
    # the corpus is) and .github/badges/check-abap2ui5.json (what this gate
    # made of it), so the step above already rewrote both with what the corpus
    # now is. The default branch is protected and github-actions[bot] can
    # never be added to a bypass list, so they are committed onto the PULL
    # REQUEST branch - the pull request that changes the corpus is what
    # changes the badges, and main picks them up when that pull request
    # merges. Same mechanism as publish-overview-apps, including the fallback
    # for refs that cannot be pushed to: there the stale badge is reported,
    # never silently accepted. Only after a green gate: a red pull request
    # cannot merge, so its badges would never reach main anyway - and a badge
    # commit on top of a failing run reads as if something had been fixed
    - name: Publish the badges
      if: success()
      env:
        # only a same-repository pull request can be pushed to with
        # GITHUB_TOKEN; on main and from a fork the badge is only reported
        PUSHABLE: ${{ github.event_name == 'pull_request'
                      && github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        if git diff --quiet -- .github/badges; then
          echo "The linter badges are up to date."
          exit 0
        fi
        git diff -- .github/badges
        if [ "$PUSHABLE" != "true" ]; then
          echo "::warning::The linter badges are out of date and this ref cannot be pushed to. Run 'npm run check:abap2ui5' and commit .github/badges/."
          exit 0
        fi
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -qm 'Refresh the abap2UI5-linter badges' -- .github/badges
        git push
        echo "Badges refreshed and pushed onto the pull request branch."
