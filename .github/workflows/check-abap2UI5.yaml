name: check-abap2UI5

# The abap2UI5-specific lint, as opposed to abap-standard/cloud/702, which
# lint ABAP itself. It checks a whole app class against five rule groups:
# the controls and members it writes, the structure of the document, the
# UI5 version and deprecation floor, the data and usability of the result,
# and the abap2ui5 semantics - the defects that live in the relationship
# between the ABAP class and the view it builds, which no UI5 tooling sees.
# Configuration lives in abap2ui5lint.jsonc; the linter is a devDependency
# resolved through package-lock.json, so CI and `npm run check:abap2ui5` run
# the same version.
#
# @abap2ui5/linter-render is the SECOND devDependency, and the render gate
# below is the only reason for it: it carries the @openui5 source packages and
# playwright the gate serves. The linter names it as an OPTIONAL PEER, which
# is the one dependency kind npm does not install on its own - so it has to be
# declared here, or `npx abap2ui5lint` reports the runtime missing and the 156
# documents stop being rendered. It used to arrive by itself, as an optional
# DEPENDENCY of the linter, which npm does install by default; splitting it
# out is what keeps a plain `npx @abap2ui5/linter` a small download. Up to
# 0.7.0 the same package was published as @abap2ui5/render-runtime (now
# deprecated); from 0.8.0 on it is @abap2ui5/linter-render.
#
# The run reports what it LOOKED at, not only what it found: the gates log
# every file into a collapsed group while they run, and the job closes with
# the run summary (how many classes, views, controls, bindings and icons were
# judged, what the baseline swallowed, how long each gate took). On a corpus
# whose findings are all baselined that summary is the only thing standing
# between "148 classes were checked" and "nothing was checkable" - a
# distinction this repository has been on the wrong side of before
# (AGENTS.md 6). It also goes into the job summary of the run, and into the
# two README badges below.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: check-abap2UI5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-abap2UI5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    # the render gate drives a headless browser
    - run: npx playwright install chromium --with-deps
    - run: npm run check:abap2ui5

    # The same corpus once more as markdown, into the job summary - findings
    # and run summary on the run's own page, without expanding a log. A second
    # pass, costing the property gate only (--no-render: whether the views
    # load was decided by the step above), and --no-badge because a pass that
    # skipped a gate must not overwrite the badge the real run wrote. Called
    # directly rather than as `npm run check:abap2ui5`, deliberately: these
    # flags are what make it a report and not the gate.
    - name: Job summary
      if: always()
      run: npx abap2ui5lint --no-render --advisory --no-progress --no-badge --format markdown >> "$GITHUB_STEP_SUMMARY"

    # The gate above rewrote .github/badges/ (abap2ui5lint.jsonc "badge"), and
    # this step publishes those two files to the `badges` branch - an
    # orphan branch that holds nothing else and is what the README badges
    # read. Only on main: main is protected and github-actions[bot] cannot
    # bypass that, and the old way round - committing the badges onto the
    # pull request branch - started a second set of runs on that commit which
    # waited for a maintainer's approval and left the pull request blocked.
    # A pull request run publishes nothing; the run on main after the merge
    # does. Only after a green gate, as before. A failed push (a ruleset on
    # the branch) is a warning: the README then keeps showing the previous
    # state rather than a wrong one.
    - name: Publish the badges
      if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        ls .github/badges/*.json >/dev/null 2>&1 || { echo "::warning::The gate wrote no badge files - nothing to publish."; exit 0; }
        dir="$RUNNER_TEMP/badges"
        if git ls-remote --exit-code --heads origin badges >/dev/null; then
          git fetch -q --depth=1 origin badges
          git worktree add -q "$dir" FETCH_HEAD
          git -C "$dir" checkout -q -B badges
        else
          git worktree add -q --detach "$dir"
          git -C "$dir" switch -q --orphan badges
        fi
        cp .github/badges/*.json "$dir/"
        cd "$dir"
        git add -A
        if git diff --cached --quiet; then
          echo "The badges branch is up to date."
          exit 0
        fi
        git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
          commit -qm "Badges for ${GITHUB_SHA::7}"
        if git push -q origin badges; then
          echo "Badges published to the badges branch."
        else
          echo "::warning::The badges could not be pushed to the badges branch - the README keeps showing the previous state."
        fi
