name: publish-overview-apps

# Keeps the overview app (get_catalog), SAMPLES.md and catalogue.json
# mirroring the folder tree. All three are written by `npm run launchpad` out
# of one scan, so they are checked and pushed together - a catalogue that
# disagrees with the app it claims to mirror is worse than no catalogue.
#
# The catalog is generated entirely from the folder tree and the class
# descriptions, so the fix for a stale catalog is always the same one command.
# Rather than failing the pull request and asking for it, this regenerates and
# pushes the result onto the pull request branch - a stale catalog no longer
# blocks anyone.
#
# Read the resulting commit: it is a real change to what the overview offers.
# A class that stops matching the sample naming scheme silently loses its tile,
# and that shows up here as a deletion.
#
# Pushing works because the pull request branch is not protected. The default
# branch is: it is protected and github-actions[bot] can never be added to a
# bypass list - neither in classic branch protection nor in a ruleset - so a
# push there is always rejected. A pull request from a fork cannot be pushed to
# with GITHUB_TOKEN either; both cases fall back to failing with the command to
# run, which is what this workflow did everywhere before.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-overview-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overview_apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # check out the branch, not the merge commit, so a push can go back
        ref: ${{ github.event.pull_request.head.ref || github.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run launchpad

    - name: Publish the regenerated catalogs
      env:
        # only a same-repository pull request can be pushed to with GITHUB_TOKEN
        PUSHABLE: ${{ github.event_name == 'pull_request'
                      && github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        if git diff --quiet -- src SAMPLES.md catalogue.json; then
          echo "The overview app, SAMPLES.md and catalogue.json are up to date."
          exit 0
        fi
        git diff --stat -- src SAMPLES.md catalogue.json
        if [ "$PUSHABLE" != "true" ]; then
          echo "::error::The overview catalog is out of date and this ref cannot be pushed to. Run 'npm run launchpad', commit the result and push (see AGENTS.md §4)."
          exit 1
        fi
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -qm 'Regenerate the overview app' -- src SAMPLES.md catalogue.json
        git push
        echo "Overview app regenerated and pushed onto the pull request branch."
