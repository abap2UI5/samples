name: publish-702

# Rebuilds the 702 branch via publish-branch.yaml: downports the sources,
# lints with the 702 config and force-pushes.

on:
  push:
    branches: [standard]
  # Manual rebuild, e.g. after a direct push to standard that started no run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-702
  cancel-in-progress: false

jobs:
  publish-702:
    uses: ./.github/workflows/publish-branch.yaml
    with:
      branch: '702'
      do_downport: true
      lint_config: .github/abaplint/abap_702.jsonc
