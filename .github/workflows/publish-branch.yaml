name: publish-branch

# Shared implementation for publish-cloud/publish-702: transforms the
# standard branch content, validates it with abaplint and force-pushes
# the result to the given output branch. The thin auto_<name> callers
# provide the trigger and the parameters.

on:
  workflow_call:
    inputs:
      branch:
        description: "Output branch: cloud | 702"
        required: true
        type: string
      do_downport:
        description: "Downport before pushing (702); otherwise only the stripped packages are removed (cloud)"
        required: false
        type: boolean
        default: false
      lint_config:
        description: "abaplint config used to validate the content before the push"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - run: npm ci

    - name: Remove restricted, testing and obsolete samples
      if: ${{ !inputs.do_downport }}
      run: rm -rf src/02 src/00/98 src/00/99

    - name: Downport
      if: inputs.do_downport
      run: npm run downport

    # The release-specific config is passed explicitly and never copied over
    # the root abaplint.jsonc: the abaplint GitHub App picks the root config up
    # on the derived branch, and it resolves dependencies from the installed
    # repository's default branch - the `branch` field is a CLI feature. A v702
    # root config there would check the downported samples against the
    # un-downported abap2UI5@main. See AGENTS.md section 2.
    - name: Lint ${{ inputs.branch }} content
      run: npx abaplint ${{ inputs.lint_config }}

    - name: Commit and push to ${{ inputs.branch }}
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add -A
        git commit -m "generate ${BRANCH} from ${GITHUB_SHA}"
        git push --force origin "HEAD:${BRANCH}"
