name: publish-cloud

# Rebuilds the cloud branch via publish-branch.yaml: removes the restricted
# samples (src/00), lints with the cloud config and force-pushes.

on:
  push:
    branches: [standard]
  # Manual rebuild, e.g. after a direct push to standard that started no run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cloud
  cancel-in-progress: false

jobs:
  publish-cloud:
    uses: ./.github/workflows/publish-branch.yaml
    with:
      branch: cloud
      lint_config: .github/abaplint/abap_cloud.jsonc
