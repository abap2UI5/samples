name: check-docs

# Machine checks for the parts of AGENTS.md that describe the repository
# rather than advise on it, and that therefore rot silently: the §1 package
# tree against the actual package.devc.xml CTEXTs, and the §2 strip list
# against the downport script that does the stripping.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents_structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node scripts/check-agents-structure.mjs

  strip_lists:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node scripts/check-strip-lists.mjs

  # The view-chain layout used to be a job here, running scripts/chain-format.mjs
  # because no linter rule judged the four-space STEP. `chain-house-layout` does,
  # and it is stricter than the pair it replaced, so the layout is now gated
  # where every other view rule already is - check-abap2UI5.yaml. One rule, one
  # implementation, one place it can fail. `npm run fmt:chains` applies it.

  # Class names written in prose, against the repositories that own them.
  #
  # The three READMEs carry the same learning-path table naming each other's
  # overview apps. When samples-controls renamed its overview, two of the three
  # copies went on telling readers to run a class that no longer exists - which
  # nothing here could notice, because nothing here reads that repository.
  #
  # Foreign sample names resolve through the owning repository's generated
  # SAMPLES.md over raw.githubusercontent.com; framework names need the sources,
  # so abap2UI5/src is sparse-checked-out next to this one. Without it the run
  # SAYS which names it could not check rather than passing them silently - and
  # the stale name that prompted this gate was a framework-shaped one, so the
  # checkout is what makes the check real.
  prose_names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: abap2UI5/abap2UI5
        ref: main
        path: .abap2UI5
        fetch-depth: 1
        sparse-checkout: src
        sparse-checkout-cone-mode: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    # A runner cannot check a repository out above the workspace, so the
    # framework lands inside it and the variable says where - the same
    # env-over-sibling resolution abap2UI5/mcp-server uses.
    - run: node scripts/check-prose-names.mjs
      env:
        A2UI5_HOME: ${{ github.workspace }}/.abap2UI5

  # The two published catalogues, and the learning path behind them.
  #
  # This job replaces `overview_page`, which ran the learning-path rules out of
  # the generator behind the GitHub Pages overview page. That page is gone -
  # one catalogue over all three sample repositories is published from the
  # playground now - but the rules were never about a page: a category with no
  # stage is a sample nobody following the path can reach, and nothing else
  # notices, because it stays listed in the app and in SAMPLES.md. They live in
  # generate-catalogue.mjs now, which is what publishes `stage` to every
  # consumer.
  #
  # Which uncovered something: generate-catalogue.mjs had NO CI job at all.
  # catalogue.json is committed generated data that only `npm run check` on
  # somebody's laptop was watching. It is watched here now, and so is
  # catalogue-derived.json beside it - the linter's half, which the playground's
  # deploy reads. npm ci is for that one; the other three are plain node.
  catalogues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci --no-audit --no-fund
    - run: npm run check:catalogue
    - run: npm run check:derived
    - run: npm run check:launchpad
