name: check-docs

# Machine checks for the parts of AGENTS.md that describe the repository
# rather than advise on it, and that therefore rot silently: the §1 package
# tree against the actual package.devc.xml CTEXTs, and the §2 strip list
# against the downport script that does the stripping.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents_structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node scripts/check-agents-structure.js

  strip_lists:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node scripts/check-strip-lists.js

  # The view-chain layout. The abap2UI5-linter judges a chain's own rhythm and
  # one call per line; neither rule judges the STEP, so this is the only check
  # that holds the four-space level. `npm run fmt:chains` fixes what it reports.
  chain_format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node scripts/chain-format.mjs
