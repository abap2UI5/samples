name: deploy-web

# Publishes the overview page in web/ to this repository's GitHub Pages.
#
# The page is the learning path of `src/01` - the same samples the overview app
# lists, in the order somebody learns them - for a reader who has not installed
# anything yet. It is static: three files plus two generated-at-deploy pieces,
# `web/apps.json` and the `web/thumbs/` thumbnails, which this workflow writes
# from the tree on every deploy, so the page is never staler than the samples
# it describes and a sample pull request carries no diff of derived data.
#
# This is the only way the page is published: Settings -> Pages -> Source must
# be "GitHub Actions". The catalogue needs no dependencies - the generator
# reads the tree with plain node, the same scan the overview app and SAMPLES.md
# are built from. The thumbnails do: they are the abap2UI5-linter's render
# harness photographing every view (the same devDependencies and chromium the
# check-abap2UI5 workflow drives), which is why npm ci and the browser install
# sit below.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/generate-overview-index.mjs'
      - 'scripts/generate-screenshots.mjs'
      - 'scripts/lib/scan-samples.mjs'
      - 'scripts/lib/learning-path.json'
      - '.github/workflows/deploy-web.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

# one Pages deployment at a time; let a newer run supersede an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: The catalogue behind the page
        run: node scripts/generate-overview-index.mjs

      # A thumbnail per sample, photographed by the linter's render harness -
      # the render gate's own view of each class, not a staged picture. Best
      # effort by design, in both directions: the script skips a view the
      # headless harness cannot render (its card simply shows no picture, the
      # page treats a missing file as exactly that), and a wholesale failure
      # here - a browser download flaking, the runtime breaking - must not
      # stop the samples themselves from publishing. continue-on-error is that
      # second half; the step still fails visibly in the run when it happens.
      - run: npm ci
      - name: Install chromium for the render harness
        run: npx playwright install chromium --with-deps
      - name: One thumbnail per sample
        continue-on-error: true
        run: node scripts/generate-screenshots.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
