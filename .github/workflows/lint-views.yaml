name: lint-views

# Validates the views without an SAP system: the UI5 version/deprecation
# property gate plus a headless render smoke. Configuration lives in
# abap2ui5lint.jsonc; the linter itself is pinned as a devDependency so CI
# and a local `npm run lint:views` always run the same version.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-views-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-views:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    # the render gate drives a headless browser
    - run: npx playwright install chromium --with-deps
    - run: npx abap2ui5lint
