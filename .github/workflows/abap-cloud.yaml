name: abap-cloud

# main runs on ABAP Cloud as it is - the whole tree is linted, nothing is
# stripped first. There is no cloud branch anymore: a cloud system installs
# main directly, so every sample in the repository has to pass here.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: abap-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abap-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npx abaplint .github/abaplint/abap_cloud.jsonc
